name: Executar script Python agendado

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependências Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Criar arquivo de credenciais do Google Drive
        run: echo "${{ secrets.GOOGLE_DRIVE_JSON }}" > json_servico.json

      - name: Rodar script principal
        env:
          POWERBI_CLIENT_ID:     ${{ secrets.POWERBI_CLIENT_ID }}
          POWERBI_TENANT_ID:     ${{ secrets.POWERBI_TENANT_ID }}
          POWERBI_CLIENT_SECRET: ${{ secrets.POWERBI_CLIENT_SECRET }}
          POWERBI_WORKSPACE_ID:  ${{ secrets.POWERBI_WORKSPACE_ID }}
          POWERBI_REPORT_ID:     ${{ secrets.POWERBI_REPORT_ID }}
        run: python main.py
